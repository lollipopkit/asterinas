[package]
name = "component-macro"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = "1.0.104"
itertools = "0.10.5"
toml = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
